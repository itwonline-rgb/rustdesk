# Сборка itdesk (клиент техподдержки ITW Online) — Windows, Android, macOS, Linux.
# Запускается сама при пуше этого файла в ветку itdesk-all.
# Берём только нужные платформы из itdesk-build.yml (свой обрезанный вариант flutter-build.yml), чтобы
# лишние задания не срывали запуск.
name: itdesk all platforms
on:
  workflow_dispatch:
  push:
    branches: [itdesk-all]
    paths: ['.github/workflows/itdesk-all.yml']
jobs:
  build:
    uses: ./.github/workflows/itdesk-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "itdesk"

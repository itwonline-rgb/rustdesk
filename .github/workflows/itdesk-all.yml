# Сборка itdesk (клиент техподдержки ITW Online) под все платформы.
# Запускается сама при пуше этого файла в ветку itdesk-all.
name: itdesk all platforms
on:
  workflow_dispatch:
  push:
    branches: [itdesk-all]
    paths: ['.github/workflows/itdesk-all.yml']
jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "itdesk"
